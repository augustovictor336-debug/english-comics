<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Comics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet">
<style>
:root {
  /* Um mundo visual único: página de HQ clara, tinta preta, painéis com sombra dura. */
  --navy: #14213D;
  --yellow: #FFD43B;
  --red: #EF476F;
  --blue: #2196F3;
  --white: #FFFFFF;
  --paper: #F4F5F9;
  --ink: #171717;
  --muted: #5A6070;
  --green: #1F9D6B;
  --line: 3px solid var(--ink);
  --shadow: 5px 5px 0 var(--ink);
  --shadow-sm: 3px 3px 0 var(--ink);
  --font-display: "Bangers", "Impact", "Arial Black", system-ui, sans-serif;
  --font-body: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper);
  background-image: radial-gradient(rgba(20,33,61,.07) 1.2px, transparent 1.3px);
  background-size: 14px 14px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, .display { font-family: var(--font-display); font-weight: 400; letter-spacing: .04em; line-height: 1.05; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 4vw, 2.8rem); }
h2 { font-size: 1.7rem; }
h3 { font-size: 1.3rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
img, svg { max-width: 100%; }
.num { font-variant-numeric: tabular-nums; }

/* ── Layout ── */
.app { display: grid; grid-template-columns: 250px 1fr; min-height: 100%; }
.side {
  background: var(--navy); color: var(--white); padding: 20px 14px; position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 18px; border-right: var(--line); overflow-y: auto;
}
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 6px; text-decoration: none; color: inherit; }
.logo-mark { width: 46px; height: 46px; flex: none; }
.logo-text { font-family: var(--font-display); font-size: 1.55rem; line-height: .95; letter-spacing: .05em; }
.logo-text span { color: var(--yellow); display: block; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: #DCE3F2; text-decoration: none;
  font-weight: 700; border: 2px solid transparent; transition: background .15s, transform .15s;
}
.nav a:hover { background: rgba(255,255,255,.08); }
.nav a.on { background: var(--yellow); color: var(--ink); border-color: var(--ink); box-shadow: 3px 3px 0 #000; transform: translate(-1px,-1px); }
.nav .ico { width: 22px; height: 22px; flex: none; }
.side-foot { margin-top: auto; font-size: .82rem; color: #AEB8CF; display: grid; gap: 8px; }
.sync { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; background: rgba(255,255,255,.08); font-weight: 700; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); }
.sync.cloud i { background: #4ADE80; }
.main { min-width: 0; padding: 24px clamp(16px, 3vw, 40px) 110px; }
.view { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 2px solid var(--ink); border-radius: 99px; background: var(--white); font-weight: 800; font-size: .88rem; white-space: nowrap; }
.chip.y { background: var(--yellow); } .chip.r { background: var(--red); color: var(--white); } .chip.b { background: var(--blue); color: var(--white); } .chip.n { background: var(--navy); color: var(--white); } .chip.g { background: #D6F5E8; }
.mob-head { display: none; }
.bottom-nav { display: none; }

/* ── Panels ── */
.panel { background: var(--white); border: var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; position: relative; min-width: 0; }
.panel.y { background: var(--yellow); } .panel.n { background: var(--navy); color: var(--white); } .panel.b { background: #E3F1FD; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.ico { width: 20px; height: 20px; flex: none; }
.caption { display: inline-block; justify-self: start; width: fit-content; background: var(--yellow); border: 2px solid var(--ink); padding: 2px 10px; font-family: var(--font-display); letter-spacing: .06em; font-size: 1rem; transform: rotate(-1.5deg); box-shadow: 2px 2px 0 var(--ink); }
.caption.r { background: var(--red); color: var(--white); } .caption.b { background: var(--blue); color: var(--white); }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-auto { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.span2 { grid-column: span 2; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border: var(--line); border-radius: 12px;
  background: var(--white); box-shadow: var(--shadow-sm); font-weight: 900; cursor: pointer; text-decoration: none; color: var(--ink);
  transition: transform .1s, box-shadow .1s; text-align: center; line-height: 1.2;
}
.btn:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.y { background: var(--yellow); } .btn.r { background: var(--red); color: var(--white); } .btn.b { background: var(--blue); color: var(--white); } .btn.n { background: var(--navy); color: var(--white); }
.btn.big { font-family: var(--font-display); font-weight: 400; font-size: 1.45rem; letter-spacing: .06em; padding: 12px 26px; }
.btn.sm { padding: 6px 12px; font-size: .88rem; border-width: 2px; box-shadow: 2px 2px 0 var(--ink); }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; text-decoration: underline; padding: 6px 8px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: var(--shadow-sm); }
.icon-btn { width: 40px; height: 40px; padding: 0; border-radius: 50%; flex: none; }
.icon-btn.sm { width: 32px; height: 32px; }

/* ── Speech bubble ── */
.bubble { position: relative; background: var(--white); border: var(--line); border-radius: 22px; padding: 14px 18px; box-shadow: var(--shadow-sm); }
.bubble.left::after, .bubble.left::before { content: ""; position: absolute; left: -16px; bottom: 18px; border: 10px solid transparent; }
.bubble.left::before { border-right: 16px solid var(--ink); border-left: 0; left: -19px; }
.bubble.left::after { border-right: 14px solid var(--white); border-left: 0; left: -13px; bottom: 20px; border-width: 8px 14px 8px 0; }

/* ── Hero ── */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 12% 60%, rgba(255,255,255,.18) 0 6deg, transparent 6deg 18deg); pointer-events: none; }
.hero > * { position: relative; }
.teacher { width: 150px; height: 170px; }
.hero h1 { color: var(--ink); }
.hero .lead { font-weight: 700; max-width: 60ch; }

/* ── Stat tiles ── */
.tile { background: var(--white); border: var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.tile .k { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--muted); }
.tile .v { font-family: var(--font-display); font-size: 2.2rem; letter-spacing: .03em; line-height: 1; }
.tile .s { font-size: .85rem; color: var(--muted); font-weight: 600; }
.tile.y { background: var(--yellow); } .tile.r { background: #FFE3EA; } .tile.b { background: #E3F1FD; }
.bar { height: 14px; border: 2px solid var(--ink); border-radius: 99px; background: var(--paper); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--blue); border-right: 2px solid var(--ink); transition: width .4s; }
.bar.y > i { background: var(--yellow); } .bar.r > i { background: var(--red); } .bar.g > i { background: var(--green); }
.bar > i[style*="width:0%"] { border-right: 0; }

/* ── Week plan ── */
.plan { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.day { border: 2px solid var(--ink); border-radius: 12px; padding: 10px 8px; background: var(--white); display: grid; gap: 4px; text-align: left; cursor: pointer; min-height: 104px; align-content: start; transition: transform .12s; }
.day:hover { transform: translateY(-2px); }
.day .dn { font-family: var(--font-display); font-size: 1.1rem; letter-spacing: .05em; }
.day .dt { font-size: .8rem; font-weight: 700; line-height: 1.25; }
.day.today { background: var(--yellow); box-shadow: 3px 3px 0 var(--ink); }
.day.done { background: #D6F5E8; }
.day.done .dn::after { content: " ✓"; color: var(--green); }

/* ── Word cards ── */
.wcard { border: var(--line); border-radius: var(--r); background: var(--white); box-shadow: var(--shadow-sm); overflow: hidden; display: grid; cursor: pointer; text-align: left; padding: 0; transition: transform .12s; }
.wcard:hover { transform: translate(-2px,-2px); box-shadow: var(--shadow); }
.wart { height: 104px; display: grid; place-items: center; font-size: 3.3rem; border-bottom: var(--line); position: relative; background-color: var(--c, #E3F1FD); background-image: radial-gradient(rgba(0,0,0,.13) 1.4px, transparent 1.5px); background-size: 9px 9px; }
.wart .tag { position: absolute; top: 8px; left: 8px; }
.wart .st { position: absolute; top: 8px; right: 8px; }
.wbody { padding: 12px 14px 14px; display: grid; gap: 2px; }
.wbody .en { font-family: var(--font-display); font-size: 1.6rem; letter-spacing: .04em; }
.wbody .pt { font-weight: 700; color: var(--muted); }
.pill { font-size: .72rem; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border: 2px solid var(--ink); border-radius: 99px; background: var(--white); }
.pill.ok { background: #D6F5E8; } .pill.lr { background: var(--yellow); } .pill.rv { background: #FFE3EA; } .pill.nw { background: var(--white); }

/* ── Word detail ── */
.wd { display: grid; grid-template-columns: 260px 1fr; gap: 22px; }
.wd .wart { height: 220px; font-size: 6rem; border: var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); }
.wd-word { font-family: var(--font-display); font-size: clamp(2.6rem, 6vw, 4rem); letter-spacing: .04em; line-height: .95; }
.ex { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 12px; background: var(--paper); }
.ex .e { font-weight: 800; }
.ex .t { color: var(--muted); font-size: .92rem; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { padding: 7px 14px; border: 2px solid var(--ink); border-radius: 10px; background: var(--white); font-weight: 800; cursor: pointer; }
.tab.on { background: var(--navy); color: var(--white); box-shadow: 2px 2px 0 var(--ink); }

/* ── Comic panels (Word in Action) ── */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.cpanel { border: var(--line); background: var(--white); box-shadow: var(--shadow-sm); display: grid; grid-template-rows: auto 1fr; border-radius: 6px; overflow: hidden; }
.cpanel:nth-child(2n) { transform: rotate(.6deg); } .cpanel:nth-child(3n) { transform: rotate(-.6deg); }
.scene { height: 150px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 3.6rem; position: relative; background-color: var(--c); background-image: radial-gradient(rgba(0,0,0,.14) 1.4px, transparent 1.5px); background-size: 9px 9px; border-bottom: var(--line); }
.scene .lbl { position: absolute; left: 0; top: 0; background: var(--yellow); border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); font-weight: 900; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; padding: 4px 10px; }
.scene .n { position: absolute; right: 8px; bottom: 6px; font-family: var(--font-display); font-size: 1.6rem; color: var(--white); -webkit-text-stroke: 1.5px var(--ink); }
.cpanel .txt { padding: 12px 14px; display: grid; gap: 4px; align-content: start; }

/* ── Forms ── */
.field { display: grid; gap: 6px; }
.field label { font-weight: 800; font-size: .9rem; }
.input, textarea.input, select.input { width: 100%; border: var(--line); border-radius: 12px; padding: 10px 14px; background: var(--white); font-size: 1rem; }
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { outline: none; box-shadow: 0 0 0 3px var(--blue); }
.input.ok { background: #D6F5E8; } .input.bad { background: #FFE3EA; }

/* ── Options ── */
.opts { display: grid; gap: 10px; }
.opt { text-align: left; padding: 12px 16px; border: var(--line); border-radius: 12px; background: var(--white); font-weight: 800; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform .1s; }
.opt:hover:not([disabled]) { transform: translate(-1px,-1px); }
.opt.sel { background: #E3F1FD; }
.opt.ok { background: #D6F5E8; } .opt.bad { background: #FFE3EA; }
.opt[disabled] { cursor: default; }

/* ── Sentence builder ── */
.zone { min-height: 64px; border: 3px dashed var(--ink); border-radius: 14px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--paper); }
.zone.ans { background: #FFFBE6; }
.zone.empty::before { content: attr(data-empty); color: var(--muted); font-weight: 700; font-size: .9rem; }
.tok { padding: 8px 14px; border: 2px solid var(--ink); border-radius: 10px; background: var(--white); font-weight: 800; cursor: grab; box-shadow: 2px 2px 0 var(--ink); user-select: none; touch-action: manipulation; }
.tok:hover { background: var(--yellow); }
.tok.drag { opacity: .4; }
.zone.ok { border-color: var(--green); background: #D6F5E8; } .zone.bad { border-color: var(--red); background: #FFE3EA; }

/* ── Feedback ── */
.fb { border: var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; box-shadow: var(--shadow-sm); }
.fb.ok { background: #D6F5E8; } .fb.bad { background: #FFE3EA; } .fb.info { background: #E3F1FD; }
.fb .h { font-family: var(--font-display); font-size: 1.4rem; letter-spacing: .05em; }
.pending { border: 3px dashed var(--ink); border-radius: 14px; padding: 16px; background: #FFF6D6; display: grid; gap: 6px; }
.pending b { font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; letter-spacing: .05em; }

/* ── Session overlay ── */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(20,33,61,.72); display: none; align-items: flex-start; justify-content: center; padding: 24px 14px; overflow-y: auto; }
.overlay.open { display: flex; }
.sheet { width: min(760px, 100%); background: var(--paper); border: var(--line); border-radius: 18px; box-shadow: 8px 8px 0 #000; padding: 22px; display: grid; gap: 18px; position: relative; margin: auto 0; }
.sheet-h { display: flex; align-items: center; gap: 12px; }
.sheet-h .bar { flex: 1; }
.q-type { font-size: .78rem; text-transform: uppercase; font-weight: 900; letter-spacing: .08em; color: var(--muted); }
.q-text { font-size: 1.35rem; font-weight: 900; line-height: 1.3; }
.q-big { font-family: var(--font-display); font-size: 2.6rem; letter-spacing: .04em; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mitem { padding: 10px 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--white); font-weight: 800; cursor: pointer; text-align: left; }
.mitem.sel { background: var(--yellow); } .mitem.done { background: #D6F5E8; cursor: default; opacity: .8; } .mitem.bad { background: #FFE3EA; }
.sent-tokens { display: flex; flex-wrap: wrap; gap: 8px; }
.flash { min-height: 220px; display: grid; place-items: center; text-align: center; gap: 10px; }

/* ── Chat ── */
.chat { display: grid; grid-template-rows: auto 1fr auto; height: min(72vh, 760px); min-height: 460px; padding: 0; overflow: hidden; }
.chat-h { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: var(--line); background: var(--yellow); flex-wrap: wrap; }
.msgs { overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; background-color: #FBFCFF; background-image: radial-gradient(rgba(20,33,61,.06) 1.2px, transparent 1.3px); background-size: 12px 12px; }
.msg { display: flex; gap: 10px; align-items: flex-end; max-width: 88%; }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.msg .av { width: 42px; height: 42px; flex: none; }
.msg .bubble { padding: 10px 14px; }
.msg.me .bubble { background: #E3F1FD; }
.fix { margin-top: 8px; border: 2px solid var(--ink); border-radius: 12px; background: #FFF6D6; padding: 10px 12px; font-size: .92rem; display: grid; gap: 4px; }
.fix .nat { font-weight: 900; }
.composer { display: flex; gap: 8px; padding: 12px; border-top: var(--line); background: var(--white); align-items: flex-end; }
.composer textarea { min-height: 46px; max-height: 140px; }
.mic.on { background: var(--red); color: var(--white); animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.07); } }
.typing { display: inline-flex; gap: 4px; } .typing i { width: 8px; height: 8px; background: var(--ink); border-radius: 50%; animation: blink 1s infinite; } .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }
.cat { display: grid; gap: 6px; text-align: left; padding: 14px; cursor: pointer; border: var(--line); border-radius: 14px; background: var(--white); box-shadow: var(--shadow-sm); transition: transform .12s; }
.cat:hover { transform: translate(-2px,-2px); box-shadow: var(--shadow); }
.cat .ic { font-size: 2rem; }
.cat .t { font-family: var(--font-display); font-size: 1.3rem; letter-spacing: .04em; }

/* ── Achievements ── */
.ach { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 12px; border: var(--line); border-radius: 14px; background: var(--white); }
.ach.lock { background: var(--paper); opacity: .65; filter: grayscale(1); }
.ach .medal { width: 64px; height: 64px; }
.ach .t { font-family: var(--font-display); font-size: 1.2rem; letter-spacing: .05em; }

/* ── Burst ── */
.burst { position: fixed; left: 50%; top: 38%; z-index: 80; pointer-events: none; transform: translate(-50%,-50%) scale(.2) rotate(-12deg); opacity: 0; }
.burst.go { animation: burst 1.1s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes burst { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.2) rotate(-12deg); } 25% { opacity: 1; transform: translate(-50%,-50%) scale(1.08) rotate(-6deg); } 75% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(-6deg); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(1.25) rotate(-6deg); } }
.toast { position: fixed; right: 18px; bottom: 18px; z-index: 90; display: grid; gap: 8px; }
.toast div { background: var(--navy); color: var(--white); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 14px; font-weight: 800; box-shadow: 3px 3px 0 #000; animation: tin .25s ease-out; }
@keyframes tin { from { transform: translateY(12px); opacity: 0; } }
.modal-card { width: min(520px, 100%); }

/* ── Charts ── */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font-body); font-size: 11px; fill: var(--muted); font-weight: 700; }
.chart .grid-l { stroke: #DDE1EA; stroke-width: 1; }
.chart .mk { transition: opacity .15s; }
.chart .mk:hover { opacity: .75; }
.tip { position: fixed; z-index: 95; pointer-events: none; background: var(--ink); color: var(--white); padding: 6px 10px; border-radius: 8px; font-size: .82rem; font-weight: 800; display: none; }
.ring { width: 96px; height: 96px; }
table.t { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.t th, table.t td { text-align: left; padding: 8px 10px; border-bottom: 2px solid #E3E6EE; }
table.t th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.scroll-x { overflow-x: auto; }
.empty { padding: 22px; text-align: center; color: var(--muted); font-weight: 700; border: 2px dashed #B8BECC; border-radius: 12px; }
.kbd { font-family: ui-monospace, monospace; background: var(--paper); border: 1px solid #ccd; border-radius: 6px; padding: 1px 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .mob-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--navy); color: var(--white); border-bottom: var(--line); position: sticky; top: 0; z-index: 30; }
  .mob-head .logo-mark { width: 36px; height: 36px; }
  .mob-head .logo-text { font-size: 1.25rem; }
  .bottom-nav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; background: var(--navy); border-top: var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .bottom-nav a, .bottom-nav button { display: grid; justify-items: center; gap: 2px; color: #DCE3F2; text-decoration: none; font-size: .7rem; font-weight: 800; background: none; border: 0; padding: 6px 2px; border-radius: 10px; cursor: pointer; }
  .bottom-nav .on { background: var(--yellow); color: var(--ink); }
  .bottom-nav .ico { width: 22px; height: 22px; }
  .g2, .g3 { grid-template-columns: 1fr; }
  .span2 { grid-column: auto; }
  .wd { grid-template-columns: 1fr; }
  .wd .wart { height: 150px; font-size: 4.5rem; }
  .hero { grid-template-columns: 1fr; }
  .teacher { width: 110px; height: 125px; }
  .main { padding-bottom: 100px; }
}
@media (max-width: 420px) {
  .g4 { grid-template-columns: 1fr 1fr; }
  .match { grid-template-columns: 1fr 1fr; gap: 6px; }
  .tile .v { font-size: 1.8rem; }
  .sheet { padding: 16px; }
}
.more-menu { position: fixed; inset: auto 10px 76px 10px; z-index: 45; background: var(--white); border: var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 10px; display: none; grid-template-columns: 1fr 1fr; gap: 6px; }
.more-menu.open { display: grid; }
.more-menu a { display: flex; gap: 8px; align-items: center; padding: 10px; border: 2px solid var(--ink); border-radius: 10px; text-decoration: none; color: var(--ink); font-weight: 800; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
